<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sakhi Audio QA</title><style>body{font-family:system-ui;margin:0;background:#f7f2ff;color:#35254f}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #35254f16}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}button{min-height:50px;border:0;border-radius:14px;padding:0 18px;font-weight:800;background:#9257de;color:white}.status{font-weight:800}.ok{color:#167255}.bad{color:#b83965}code{font-size:12px}</style></head><body><main class="wrap"><h1>🔊 Sakhi Phoneme QA</h1><p>Parent/developer audio verification. This page is not linked from Child Mode.</p><div id="list"></div></main><script src="./phoneme-audio.js"></script><script>const list=document.getElementById('list');for(const [id,x] of Object.entries(window.SAKHI_PHONEME_REGISTRY||{})){const c=document.createElement('section');c.className='card';c.innerHTML=`<div class="row"><div><h2>/${id}/</h2><div><b>${x.phoneme_id}</b> · IPA [${x.ipa}]</div><div>${x.source}</div><div><code>${x.audio_asset}</code></div><div>Source status: <b>${x.pedagogical_validation}</b></div></div><div><button>▶ Play</button><div class="status">Not tested</div></div></div>`;const b=c.querySelector('button'),s=c.querySelector('.status');b.onclick=async()=>{s.className='status';s.textContent='Playing…';const a=new Audio(x.audio_asset);try{await a.play();a.onended=()=>{s.className='status ok';s.textContent='Playback OK'};a.onerror=()=>{s.className='status bad';s.textContent='Playback failed'}}catch(e){s.className='status bad';s.textContent='Playback blocked/failed'}};list.appendChild(c)}</script></body></html>
