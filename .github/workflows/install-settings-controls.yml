name: One-time settings and controls install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-settings-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire settings controls into the application
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="./sakhi-shell.css" />'
          if 'settings-controls.css' not in s:
              s=s.replace(css, css+'\n<link rel="stylesheet" href="./settings-controls.css" />')
          s=s.replace('<label class="theme-picker">','<label class="theme-picker legacy-theme-compat" hidden aria-hidden="true">')
          app='<script src="./app.js"></script>'
          if 'settings-service.js' not in s:
              s=s.replace(app, app+'\n<script src="./settings-service.js"></script>\n<script src="./adventure-service.js"></script>')
          shell='<script src="./sakhi-shell.js"></script>'
          if 'settings-ui.js' not in s:
              s=s.replace(shell, shell+'\n<script src="./settings-ui.js"></script>')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          s=re.sub(r"const CACHE='sakhi-magic-learning-v\d+';","const CACHE='sakhi-magic-learning-v20';",s)
          if "'./settings-service.js'" not in s:
              s=s.replace("'./core-learning-services.js'","'./core-learning-services.js','./settings-service.js','./adventure-service.js','./settings-ui.js','./settings-controls.css'")
          p.write_text(s)
      - name: Validate settings/control architecture
        run: |
          node --check settings-service.js
          node --check adventure-service.js
          node --check settings-ui.js
          node --check tests/settings-controls.spec.js
          node scripts/validate-settings-controls.cjs
      - name: Commit application wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Wire real settings and adventure controls' || exit 0
          git push
