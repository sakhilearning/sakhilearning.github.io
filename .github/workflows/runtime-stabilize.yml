name: One-time runtime stabilization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-stabilize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate activity runtime
        shell: python
        run: |
          from pathlib import Path

          p=Path('interaction-engine.js')
          s=p.read_text()
          head=s.split('function validateStructuredActivity',1)[0]
          tail=r'''function validateStructuredActivity(raw){return !!window.ActivityContract?.validate(raw).ok;}

          const normalizedActivities=[];
          for(const raw of structuredActivities){
            const check=window.ActivityContract.validate(raw);
            if(check.ok){normalizedActivities.push(check.activity);window.SakhiRuntimeLog?.log('ACTIVITY_VALIDATED',{activity_id:check.activity.activity_id,interaction_type:check.activity.interaction_type});}
            else{window.SakhiRuntimeLog?.log('ACTIVITY_SCHEMA_INVALID',{activity_id:raw.id,errors:check.errors});const fallback=window.ActivityContract.fallbackFor(raw,structuredActivities);if(fallback)normalizedActivities.push(fallback);}
          }
          activities.splice(0,activities.length,...normalizedActivities);
          window.activities=activities;window.data=data;window.getStatus=getStatus;window.recordEvidence=recordEvidence;window.persist=persist;window.todayKey=todayKey;
          data.interactionEvidence=data.interactionEvidence||[];data.questResults=data.questResults||{};data.questHistory=data.questHistory||[];persist(false);

          const RENDERERS=Object.freeze({
            tap_choice:renderTapChoice,multi_select:renderMultiSelect,drag_drop:renderSort,sort:renderSort,match:renderMatch,memory:renderMemory,sequence:renderSequence,word_builder:renderWordBuilder,number_manipulative:renderNumberManipulator,pattern_builder:renderPatternBuilder,find_it:renderFindIt,trace:renderTrace,story_choice:renderTapChoice,movement:renderOffline,offline_activity:renderOffline,creative_activity:renderOffline
          });
          let interactionRuntime=null;window.interactionRuntime=null;
          function setRuntime(r){interactionRuntime=r;window.interactionRuntime=r;}
          function runtimeState(){return interactionRuntime?.state||{};}
          function setState(state,extra={}){if(!interactionRuntime)return;interactionRuntime.status=state;interactionRuntime.updatedAt=Date.now();window.SakhiRuntimeLog?.log(`ACTIVITY_${state}`,{activity_id:interactionRuntime.activity.id,...extra});renderDebug();}
          function logEvent(type,extra={}){if(!interactionRuntime)return;const evt={date:todayKey(),timestamp:new Date().toISOString(),activityId:interactionRuntime.activity.id,skill_id:interactionRuntime.activity.skill_id,interaction_type:interactionRuntime.activity.interaction_type,type,attempts:interactionRuntime.attempts,hintLevel:interactionRuntime.hintLevel,elapsed:Math.round((Date.now()-interactionRuntime.startedAt)/1000),...extra};data.interactionEvidence.push(evt);data.interactionEvidence=data.interactionEvidence.slice(-300);window.SakhiRuntimeLog?.log(type,{activity_id:evt.activityId,...extra});persist(false);}
          function shinyProgress(){const ids=data.quest||[];return `<div class="activity-progress" aria-label="Saved quest progress">${ids.map(id=>data.questResults[id]!=null?'<span class="filled">⭐</span>':'<span>☆</span>').join('')}</div>`;}
          function startRuntime(a,containerId,source){const r={activity:a,containerId,source,status:'LOADING',attempts:0,hintLevel:0,startedAt:Date.now(),lastActionAt:0,fastActions:0,saving:false,state:{selected:new Set(),placements:{},order:[],flipped:[],matched:new Set(),tracePoints:[],traceCoverage:0,count:0}};setRuntime(r);window.ProgressService?.beginLocalSession?.();window.SakhiRuntimeLog?.log('ACTIVITY_GENERATED',{activity_id:a.id,skill_id:a.skill_id,interaction_type:a.interaction_type});return r;}
          function childSafeError(containerId,a,error){const el=document.getElementById(containerId);if(el){el.classList.add('active');el.innerHTML=`<div class="runtime-error"><b>Sakhi's magic needs a tiny reset.</b><span>Nothing was lost.</span><button type="button" onclick="retryCurrentActivity()">TRY AGAIN</button></div>`;}window.SakhiRuntimeLog?.log('ACTIVITY_RENDER_FAILED',{activity_id:a?.id,interaction_type:a?.interaction_type,error:String(error?.stack||error)});if(interactionRuntime)setState('ERROR');}
          function renderDebug(){let d=document.getElementById('sakhiRuntimeDebug');if(!d){d=document.createElement('pre');d.id='sakhiRuntimeDebug';d.className='runtime-debug';document.body.appendChild(d);}const r=interactionRuntime;if(!r){d.textContent='No active activity';return;}const rect=document.getElementById('interactionMount')?.getBoundingClientRect();d.textContent=JSON.stringify({activity_id:r.activity.id,skill_id:r.activity.skill_id,interaction_type:r.activity.interaction_type,renderer:RENDERERS[r.activity.interaction_type]?.name,status:r.status,dimensions:rect?{w:Math.round(rect.width),h:Math.round(rect.height)}:null,audio_assets:r.activity.audio_assets,visual_assets:r.activity.visual_assets,correct_answer:r.activity.correct_answer,attempts:r.attempts,hint_level:r.hintLevel},null,2);}
          function visibilityAudit(a){requestAnimationFrame(()=>setTimeout(()=>{if(!interactionRuntime||interactionRuntime.activity.id!==a.id)return;const m=document.getElementById('interactionMount'),rect=m?.getBoundingClientRect(),cs=m?getComputedStyle(m):null;const bad=!m||!rect||rect.width<8||rect.height<8||cs.display==='none'||cs.visibility==='hidden'||Number(cs.opacity)===0;if(bad){window.SakhiRuntimeLog?.log('ACTIVITY_RENDER_ZERO_SIZE',{activity_id:a.id,width:rect?.width||0,height:rect?.height||0,display:cs?.display,visibility:cs?.visibility,opacity:cs?.opacity});childSafeError(interactionRuntime.containerId,a,new Error('interaction root is not visible'));}else{window.SakhiRuntimeLog?.log('ACTIVITY_RENDERED',{activity_id:a.id,renderer:RENDERERS[a.interaction_type].name,width:Math.round(rect.width),height:Math.round(rect.height)});setState('READY');}renderDebug();},40));}
          function openStructuredActivity(raw,containerId,source){
            const check=window.ActivityContract.validate(raw);let a=check.activity;
            if(!check.ok){window.SakhiRuntimeLog?.log('ACTIVITY_SCHEMA_INVALID',{activity_id:raw?.id,errors:check.errors});a=window.ActivityContract.fallbackFor(raw,activities);if(!a)return childSafeError(containerId,raw,new Error(check.errors.join('; ')));}
            const renderer=RENDERERS[a.interaction_type];if(!renderer)return childSafeError(containerId,a,new Error('renderer not registered'));
            window.SpeechService?.stopSpeech?.();startRuntime(a,containerId,source);const el=document.getElementById(containerId);if(!el)return childSafeError(containerId,a,new Error('activity container missing'));el.classList.add('active');
            el.innerHTML=`<div class="child-mission"><div class="activity-top"><div class="character-avatar" aria-hidden="true">${a.character_icon||'✨'}</div><div class="activity-top-copy"><small>${esc(a.character||'Sakhi')}</small><b>${esc(a.character_prompt)}</b></div><button class="child-tool hear activity-hear" type="button" onclick="hearCurrent()">🔊 Hear Again</button>${shinyProgress()}</div><div class="activity-instruction">${esc(a.instruction_text)}</div><div class="activity-center"><div id="interactionMount" aria-live="polite"></div></div><div class="activity-bottom"><button class="child-tool hint" type="button" onclick="showHint()">💡 Hint</button><button class="child-tool" type="button" onclick="resetCurrentActivity()">↻ Reset</button><button class="child-tool" type="button" onclick="closeStructuredActivity()">🏠 Exit</button></div><div id="structuredHint" class="structured-hint"></div><div id="structuredFeedback" class="structured-feedback" aria-live="polite"></div></div>`;
            try{renderer(a,document.getElementById('interactionMount'));visibilityAudit(a);window.AssetService?.preloadForActivity?.(nextQuestActivity());window.SpeechService?.speakInstruction?.(a.spoken_instruction);}catch(error){childSafeError(containerId,a,error);}
          }
          function runActivity(id){const a=activities.find(x=>x.id===id);if(a)openStructuredActivity(a,'activityRunner','quest');}
          function runLearningActivity(id){const a=activities.find(x=>x.id===id);if(a)openStructuredActivity(a,'learnRunner','learn');}
          function closeStructuredActivity(){window.SpeechService?.stopSpeech?.();if(!interactionRuntime)return;const el=document.getElementById(interactionRuntime.containerId);el?.classList.remove('active');if(el)el.innerHTML='';setRuntime(null);}
          function closeActivity(){closeStructuredActivity();}
          function retryCurrentActivity(){if(!interactionRuntime)return;const {activity,containerId,source}=interactionRuntime;openStructuredActivity(activity,containerId,source);}
          function resetCurrentActivity(){retryCurrentActivity();}
          function hearCurrent(){if(interactionRuntime)window.SpeechService?.speakInstruction?.(interactionRuntime.activity.spoken_instruction);}
          function showHint(){if(!interactionRuntime||interactionRuntime.saving)return;const r=interactionRuntime,a=r.activity;r.hintLevel=Math.min(3,r.hintLevel+1);setState('HINTED',{hint_level:r.hintLevel});const text=a[`hint_${r.hintLevel}`];const h=document.getElementById('structuredHint');if(h)h.textContent='💡 '+text;window.SpeechService?.speakInstruction?.(text);logEvent('HINT_SHOWN',{level:r.hintLevel});if(r.hintLevel===3)document.getElementById('interactionMount')?.classList.add('strong-scaffold');}
          function actionPulse(){if(!interactionRuntime||interactionRuntime.saving)return true;const now=Date.now();if(interactionRuntime.status==='READY')setState('IN_PROGRESS');if(interactionRuntime.lastActionAt&&now-interactionRuntime.lastActionAt<300)interactionRuntime.fastActions++;else interactionRuntime.fastActions=Math.max(0,interactionRuntime.fastActions-1);interactionRuntime.lastActionAt=now;if(interactionRuntime.fastActions>=4){const f=document.getElementById('structuredFeedback');if(f)f.textContent='✨ Slow detective mode — look, think, then tap.';logEvent('POSSIBLE_RANDOM_TAPPING');return true}return false;}
          function itemButton(i,extra=''){const visual=i.asset_id&&window.AssetService?.renderAsset?window.AssetService.renderAsset(i.asset_id,{alt:i.label||i.id}):(i.emoji?`<span>${i.emoji}</span>`:'');return `<button type="button" class="touch-item ${extra}" data-id="${esc(i.id)}">${visual}<b>${esc(i.label||i.value||i.id)}</b></button>`;}
          function renderTapChoice(a,m){m.innerHTML=`<div class="touch-grid">${shuffle(a.items).map(i=>itemButton(i,'choice-touch')).join('')}</div>`;m.querySelectorAll('.choice-touch').forEach(b=>b.onclick=()=>submitTap(b.dataset.id,b));}
          function submitTap(id,btn){if(actionPulse())return;interactionRuntime.attempts++;const a=interactionRuntime.activity;if(id===a.correct_answer){btn.classList.add('correct');finishSuccess(null,{selected:id});}else{btn.classList.add('gentle-wrong');handleRetry();}}
          function renderMultiSelect(a,m){m.innerHTML=`<div class="touch-grid">${shuffle(a.items).map(i=>itemButton(i,'multi-touch')).join('')}</div><button class="big-action" type="button" onclick="checkMultiSelect()">⭐ Check My Picks</button>`;m.querySelectorAll('.multi-touch').forEach(b=>b.onclick=()=>{if(actionPulse())return;b.classList.toggle('selected');const s=runtimeState().selected;b.classList.contains('selected')?s.add(b.dataset.id):s.delete(b.dataset.id);});}
          function checkMultiSelect(){if(actionPulse())return;const a=interactionRuntime.activity,s=[...runtimeState().selected];interactionRuntime.attempts++;let ok=false;if(a.correct_answer?.rule==='one_per_group'){const groups=a.correct_answer.groups;ok=groups.every(g=>s.filter(id=>a.items.find(i=>i.id===id)?.group===g).length===1)&&s.length===groups.length;}else ok=s.length===a.correct_answer.length&&a.correct_answer.every(x=>s.includes(x));ok?finishSuccess(null,{selected:s}):handleRetry();}
          function renderSort(a,m){m.innerHTML=`<div class="drag-source">${shuffle(a.items).map(i=>`<div class="draggable-wrap">${itemButton(i,'drag-item')}</div>`).join('')}</div><div class="target-grid">${a.targets.map(t=>`<button type="button" class="drop-target" data-target="${esc(t.id)}"><span>${t.emoji||'✨'}</span><b>${esc(t.label)}</b><div class="placed"></div></button>`).join('')}</div><div class="tap-fallback">Drag an item, or tap it and then tap its home.</div><button class="big-action" type="button" onclick="checkPlacements()">⭐ Check My Sort</button>`;enableDragTap(m);}
          function enableDragTap(m){let selected=null;m.querySelectorAll('.drag-item').forEach(b=>{b.draggable=true;b.addEventListener('dragstart',e=>{if(actionPulse()){e.preventDefault();return;}e.dataTransfer.setData('text/plain',b.dataset.id)});b.onclick=()=>{if(actionPulse())return;selected=b.dataset.id;m.querySelectorAll('.drag-item').forEach(x=>x.classList.toggle('selected',x.dataset.id===selected));}});m.querySelectorAll('.drop-target').forEach(t=>{t.addEventListener('dragover',e=>e.preventDefault());t.addEventListener('drop',e=>{e.preventDefault();placeItem(e.dataTransfer.getData('text/plain'),t.dataset.target,m)});t.onclick=()=>{if(selected){placeItem(selected,t.dataset.target,m);selected=null;}}});}
          function placeItem(itemId,targetId,m){if(!itemId||interactionRuntime?.saving)return;runtimeState().placements[itemId]=targetId;const item=interactionRuntime.activity.items.find(i=>i.id===itemId);m.querySelectorAll(`[data-placed="${CSS.escape(itemId)}"]`).forEach(x=>x.remove());m.querySelector(`[data-id="${CSS.escape(itemId)}"]`)?.classList.add('placed-away');const target=m.querySelector(`[data-target="${CSS.escape(targetId)}"] .placed`);target?.insertAdjacentHTML('beforeend',`<span class="placed-chip" data-placed="${esc(itemId)}">${item?.emoji||''} ${esc(item?.label||itemId)}</span>`);}
          function checkPlacements(){if(actionPulse())return;const a=interactionRuntime.activity,p=runtimeState().placements;interactionRuntime.attempts++;const ok=Object.keys(a.correct_answer).every(id=>p[id]===a.correct_answer[id])&&Object.keys(p).length===Object.keys(a.correct_answer).length;ok?finishSuccess(null,{placements:{...p}}):handleRetry();}
          function renderMatch(a,m){m.innerHTML=`<div class="match-cols"><div>${a.items.map(i=>itemButton(i,'match-left')).join('')}</div><div>${shuffle(a.targets).map(t=>`<button type="button" class="touch-item match-right" data-id="${esc(t.id)}">${t.emoji?`<span>${t.emoji}</span>`:''}<b>${esc(t.label)}</b></button>`).join('')}</div></div><div class="match-status" id="matchStatus"></div>`;let left=null;m.querySelectorAll('.match-left').forEach(b=>b.onclick=()=>{if(actionPulse())return;left=b.dataset.id;m.querySelectorAll('.match-left').forEach(x=>x.classList.toggle('selected',x.dataset.id===left));});m.querySelectorAll('.match-right').forEach(b=>b.onclick=()=>{if(!left||actionPulse())return;interactionRuntime.attempts++;const ok=a.correct_answer[left]===b.dataset.id;if(ok){runtimeState().matched.add(left);m.querySelector(`[data-id="${CSS.escape(left)}"]`)?.classList.add('correct');b.classList.add('correct');document.getElementById('matchStatus').textContent='✨ Match found!';if(runtimeState().matched.size===a.items.length)finishSuccess(null,{matched:[...runtimeState().matched]});}else{b.classList.add('gentle-wrong');handleRetry(false);}left=null;});}
          function renderMemory(a,m){m.innerHTML=`<div class="memory-grid">${shuffle(a.items).map(i=>`<button type="button" class="memory-card" data-id="${esc(i.id)}" data-pair="${esc(i.pair)}"><span class="back">⭐</span><span class="front">${esc(i.label)}</span></button>`).join('')}</div>`;m.querySelectorAll('.memory-card').forEach(b=>b.onclick=()=>flipMemory(b));}
          function flipMemory(b){if(actionPulse())return;const st=runtimeState();if(st.flipped.length>=2||b.classList.contains('matched'))return;b.classList.add('flipped');st.flipped.push(b);if(st.flipped.length===2){interactionRuntime.attempts++;const[x,y]=st.flipped;if(x.dataset.pair===y.dataset.pair){x.classList.add('matched');y.classList.add('matched');st.matched.add(x.dataset.pair);st.flipped=[];if(st.matched.size===interactionRuntime.activity.correct_answer.length)finishSuccess(null,{matched:[...st.matched]});}else setTimeout(()=>{x.classList.remove('flipped');y.classList.remove('flipped');st.flipped=[];},650);}}
          function renderSequence(a,m){runtimeState().order=shuffle(a.items.map(i=>i.id));m.innerHTML=`<div class="sequence-list" id="sequenceList"></div><button class="big-action" type="button" onclick="checkSequence()">⭐ Check My Order</button>`;renderSequenceList();}
          function renderSequenceList(){const a=interactionRuntime.activity,box=document.getElementById('sequenceList');if(!box)return;box.innerHTML=runtimeState().order.map((id,idx)=>{const i=a.items.find(x=>x.id===id);return `<div class="sequence-card"><span>${i.emoji||'✨'}</span><b>${esc(i.label)}</b><div><button type="button" onclick="moveSequence(${idx},-1)">⬆️</button><button type="button" onclick="moveSequence(${idx},1)">⬇️</button></div></div>`}).join('');}
          function moveSequence(i,d){if(actionPulse())return;const o=runtimeState().order,j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];renderSequenceList();}
          function checkSequence(){if(actionPulse())return;interactionRuntime.attempts++;const a=interactionRuntime.activity,o=runtimeState().order;const ok=o.length===a.correct_answer.length&&o.every((x,i)=>x===a.correct_answer[i]);ok?finishSuccess(null,{order:[...o]}):handleRetry();}
          function renderWordBuilder(a,m){runtimeState().order=[];runtimeState().tileIds=[];m.innerHTML=`<div class="word-slots">${a.targets.map((_,i)=>`<button type="button" class="word-slot" data-slot="${i}">_</button>`).join('')}</div><div class="letter-bank">${shuffle(a.items).map(i=>itemButton(i,'letter-tile')).join('')}</div><div class="tap-fallback">Tap letters in sound order.</div><button class="big-action" type="button" onclick="checkWord()">⭐ Check My Word</button>`;m.querySelectorAll('.letter-tile').forEach(b=>b.onclick=()=>{if(actionPulse()||runtimeState().order.length>=a.targets.length)return;const item=a.items.find(i=>i.id===b.dataset.id);runtimeState().order.push(item.value);runtimeState().tileIds.push(item.id);b.disabled=true;window.SpeechService?.speakPhoneme?.(item.value);renderWordSlots();});m.querySelectorAll('.word-slot').forEach(b=>b.onclick=()=>{if(actionPulse())return;const idx=+b.dataset.slot,id=runtimeState().tileIds[idx];if(idx<runtimeState().order.length){runtimeState().order.splice(idx,1);runtimeState().tileIds.splice(idx,1);m.querySelector(`[data-id="${CSS.escape(id)}"]`)?.removeAttribute('disabled');renderWordSlots();}});}
          function renderWordSlots(){document.querySelectorAll('#interactionMount .word-slot').forEach((s,i)=>s.textContent=runtimeState().order[i]||'_');}
          function checkWord(){if(actionPulse())return;interactionRuntime.attempts++;const a=interactionRuntime.activity,o=runtimeState().order;const ok=o.length===a.correct_answer.length&&o.every((x,i)=>x===a.correct_answer[i]);ok?finishSuccess(null,{order:[...o]}):handleRetry();}
          function renderNumberManipulator(a,m){runtimeState().count=0;m.innerHTML=`<div class="number-scene"><div class="already"><small>Already has</small><div>${Array.from({length:a.initial_count||0},()=>'<span>💎</span>').join('')}</div><b>${a.initial_count||0}</b></div><div class="number-target">${a.targets[0]?.emoji||'👑'}<b>${esc(a.targets[0]?.label||'Target')}</b><div id="movedObjects"></div></div></div><div class="manip-bank">${a.items.map(i=>`<button type="button" class="manip" onclick="toggleManip(this)">${i.emoji||'💎'}</button>`).join('')}</div><button class="big-action" type="button" onclick="checkNumberManip()">⭐ Check My Number</button>`;}
          function toggleManip(b){if(actionPulse())return;b.classList.toggle('moved');runtimeState().count=[...document.querySelectorAll('#interactionMount .manip.moved')].length;document.getElementById('movedObjects').textContent=Array.from({length:runtimeState().count},()=> '💎').join(' ');}
          function checkNumberManip(){if(actionPulse())return;interactionRuntime.attempts++;const ok=runtimeState().count===Number(interactionRuntime.activity.correct_answer);ok?finishSuccess(null,{count:runtimeState().count}):handleRetry();}
          function renderPatternBuilder(a,m){runtimeState().order=[];const example=a.id==='math-pattern'?'⭐ 💖 ⭐ 💖':'⭐ 💖 💖 ⭐ 💖 💖';m.innerHTML=`<div class="pattern-example">${example} <span class="pattern-blank">?</span></div><div class="touch-grid">${a.items.map(i=>itemButton(i,'pattern-option')).join('')}</div>`;m.querySelectorAll('.pattern-option').forEach(b=>b.onclick=()=>{if(actionPulse())return;const i=a.items.find(x=>x.id===b.dataset.id);runtimeState().order=[i.value];interactionRuntime.attempts++;i.value===a.correct_answer[0]?finishSuccess(null,{value:i.value}):handleRetry();});}
          function renderFindIt(a,m){runtimeState().selected=new Set();m.innerHTML=`<div class="find-scene">${shuffle(a.items).map(i=>`<button type="button" class="find-object" data-id="${esc(i.id)}"><span>${i.emoji||'✨'}</span><b>${esc(i.label)}</b></button>`).join('')}</div><button class="big-action" type="button" onclick="checkFindIt()">⭐ I Found Them</button>`;m.querySelectorAll('.find-object').forEach(b=>b.onclick=()=>{if(actionPulse())return;b.classList.toggle('selected');b.classList.contains('selected')?runtimeState().selected.add(b.dataset.id):runtimeState().selected.delete(b.dataset.id);});}
          function checkFindIt(){if(actionPulse())return;interactionRuntime.attempts++;const s=[...runtimeState().selected],a=interactionRuntime.activity;const ok=s.length===a.correct_answer.length&&a.correct_answer.every(x=>s.includes(x));ok?finishSuccess(null,{selected:s}):handleRetry();}
          function traceScale(a,c){const xs=a.trace_points.map(p=>p[0]),ys=a.trace_points.map(p=>p[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=42,sx=(c.width-pad*2)/Math.max(1,maxX-minX),sy=(c.height-pad*2)/Math.max(1,maxY-minY),scale=Math.min(sx,sy);return a.trace_points.map(([x,y])=>[pad+(x-minX)*scale,pad+(y-minY)*scale]);}
          function renderTrace(a,m){m.innerHTML=`<div class="trace-stage"><div class="trace-wrap"><span class="trace-glyph" aria-hidden="true">${esc(a.trace_character)}</span><canvas id="traceCanvas" width="680" height="360" aria-label="Trace ${esc(a.trace_character)}"></canvas></div><div id="traceQuality" class="tap-fallback">Start at the shiny dot and follow the guide.</div><button class="big-action" type="button" onclick="checkTrace()">⭐ Check My Trace</button></div>`;setupTraceCanvas(a);}
