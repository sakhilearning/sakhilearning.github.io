name: One-time Sakhi source consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate remaining legacy source
        shell: python
        run: |
          from pathlib import Path

          p=Path('interaction-engine.js');s=p.read_text()
          replacements={
            "spoken_instruction:'Put the pictures that start with mmm in Luna’s pink cloud and the pictures that start with sss in the blue cloud.'":"spoken_instruction:'Listen to each picture name. Put the /m/ pictures in Luna’s pink cloud and the /s/ pictures in the blue cloud.'",
            "hint_2:'Mmmmoon starts with /m/.'":"hint_2:'Moon begins with the /m/ sound.'",
            "hint_3:'Moon and map go to /m/.'":"hint_3:'Moon and map begin with /m/. Sun and sock begin with /s/.'",
            "success_feedback:'Yes! Moon and map start with /m/.'":"success_feedback:'Yes! You sorted the pictures by their first sounds.'"
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'Missing expected source: {old}')
            s=s.replace(old,new)
          p.write_text(s)

          p=Path('index.html');s=p.read_text()
          if '<link rel="stylesheet" href="./design-tokens.css" />' not in s:
            s=s.replace('<link rel="stylesheet" href="./styles.css" />','<link rel="stylesheet" href="./design-tokens.css" />\n<link rel="stylesheet" href="./styles.css" />')
          old='''<script src="./app.js"></script>\n<script src="./scheduler.js"></script>\n<script src="./interaction-engine.js"></script>\n<script src="./visuals.js"></script>\n<script src="./kid-upgrade.js"></script>\n<script src="./adaptive-engine.js"></script>\n<script src="./backend-bridge.js"></script>\n<script src="./sakhi-shell.js"></script>'''
          new='''<script src="./app.js"></script>\n<script src="./core-learning-services.js"></script>\n<script src="./scheduler.js"></script>\n<script src="./interaction-engine.js"></script>\n<script src="./ui-hooks.js"></script>\n<script src="./progress-service.js"></script>\n<script src="./parent-auth-service.js"></script>\n<script src="./asset-service.js"></script>\n<script src="./visuals.js"></script>\n<script src="./kid-upgrade.js"></script>\n<script src="./adaptive-engine.js"></script>\n<script src="./backend-bridge.js"></script>\n<script src="./sakhi-shell.js"></script>'''
          if old not in s: raise SystemExit('Expected legacy script block not found')
          s=s.replace(old,new).replace('style="margin-top:12px"','class="space-top"').replace('class="grid" style="margin-top:13px"','class="grid space-top"')
          p.write_text(s)

          Path('README.md').write_text('''# Sakhi Magic Learning\n\nSakhi Magic Learning is a touch-first, mastery-based learning PWA for a Kindergarten-age learner. It automatically plans short daily adventures from curriculum readiness, review needs, recent performance, and interaction variety.\n\n## Architecture\n\nThe authoritative service map is documented in `ARCHITECTURE.md`. Feature code must not create competing speech, asset, mastery, lesson-planning, persistence, parent-auth, or lifecycle implementations.\n\n## Learning model\n\n- 15–25 minute recommended adventures\n- literacy and mathematics as frequent core domains\n- rotating comprehension, logic, science, memory, executive function, social-emotional learning, writing, creativity, motor, life skills and general knowledge\n- repeated evidence across sessions before mastery\n- spaced review and automatic next-skill selection\n- touch-first interactive activities rather than static worksheets\n\n## Audio and visuals\n\nNarration is owned by `SpeechService` and uses the configured premium ElevenLabs route through Supabase. Critical phoneme pronunciation remains a separate quality gate and is not curriculum-verified until the validated phoneme asset bank is complete. Visual selection is owned by `AssetService`; approved user-owned/original high-resolution artwork can be added there without changing activity logic.\n\n## Progress\n\n`ProgressService` owns persistence. When Family Progress Sync is authenticated, Supabase is the durable source of truth and browser storage is a local cache/offline bridge.\n\n## Hosting\n\nStatic PWA hosted at https://sakhilearning.github.io/.\n''')

          p=Path('sw.js');s=p.read_text().replace("const CACHE='sakhi-magic-learning-v16';","const CACHE='sakhi-magic-learning-v17';")
          s=s.replace("'./styles.css','./interactions.css'","'./design-tokens.css','./styles.css','./interactions.css'")
          marker="'./scheduler.js'"
          additions=['./core-learning-services.js','./ui-hooks.js','./progress-service.js','./parent-auth-service.js','./asset-service.js']
          for asset in reversed(additions):
            if repr(asset) not in s:s=s.replace(marker,repr(asset)+','+marker,1)
          p.write_text(s)
      - name: Commit consolidated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interaction-engine.js index.html README.md sw.js
          git commit -m "Consolidate Sakhi source-of-truth architecture"
          git push
