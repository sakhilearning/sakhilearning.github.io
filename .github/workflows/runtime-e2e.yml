name: Sakhi runtime browser QA
on:
  push:
    branches: [main, 'stabilization/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sakhi-runtime-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate PWA update architecture
        run: |
          node --check pwa-update.js
          node scripts/validate-pwa-update.cjs
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Run child runtime flow on Chrome, WebKit tablet and mobile
        run: npm run test:runtime
