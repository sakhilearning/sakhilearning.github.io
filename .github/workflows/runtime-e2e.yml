name: Sakhi production smoke QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sakhi-production-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate single stable production runtime
        run: |
          node --check sakhi-production.js
          node scripts/validate-production-app.cjs
