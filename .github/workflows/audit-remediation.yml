name: Audit remediation

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/audit-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layer-two:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply layer two content depth expansion
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='sakhi-activities.js';
          let s=fs.readFileSync(file,'utf8');
          const banks={
            astronomy:[['Why do we see the Moon change shape during the month?','We see different lit parts of the Moon.',['We see different lit parts of the Moon.','The Moon becomes a new planet.','Clouds cut the Moon into pieces.','The Sun turns off at night.'],'The Moon does not really change shape. We see different sunlit parts.'],['Which object is a star?','the Sun',['the Sun','the Moon','Earth','a rocket'],'The Sun is a star close enough to warm Earth.'],['Why does daytime happen?','Our side of Earth faces the Sun.',['Our side of Earth faces the Sun.','The Moon pushes light down.','Earth stops moving.','Clouds become bright.'],'Day happens when your side of Earth faces the Sun.']],
            space:[['Why do astronauts wear space suits outside a spacecraft?','Space has no air to breathe.',['Space has no air to breathe.','Space suits make rain.','Space is full of grass.','Space suits grow food.'],'A space suit protects the astronaut and provides air.'],['Which is closest to Earth?','the Moon',['the Moon','Jupiter','Saturn','another galaxy'],'The Moon is Earths closest natural neighbor in space.'],['Why do rockets need a lot of force to launch?','They must push away from Earth.',['They must push away from Earth.','They are made of paper.','They are trying to become clouds.','They move only downhill.'],'A rocket needs a strong push to lift off.']],
            solar_system:[['What do planets in our solar system move around?','the Sun',['the Sun','a tree','the classroom','a mountain'],'Planets travel around the Sun.'],['Which planet do we live on?','Earth',['Earth','Mars','Saturn','Neptune'],'Earth is our home planet.'],['Which planet is known for bright rings?','Saturn',['Saturn','Earth','Mercury','Mars'],'Saturn has large visible rings.']],
            animal_diets:[['A cow mostly eats grass. What kind of eater is it?','herbivore',['herbivore','carnivore','omnivore','meteorologist'],'Herbivores eat plants.'],['A lion hunts and eats other animals. What kind of eater is it?','carnivore',['carnivore','herbivore','map maker','gardener'],'Carnivores eat animals.'],['A bear can eat berries and fish. What kind of eater is it?','omnivore',['omnivore','herbivore only','carnivore only','astronaut'],'Omnivores eat both plants and animals.']],
            food_chain:[['In a simple chain grass -> rabbit -> fox, who eats the grass?','rabbit',['rabbit','fox','grass','cloud'],'The rabbit eats the grass.'],['Where does a food chain usually get its first energy?','the Sun',['the Sun','a backpack','a pencil','a shoe'],'Plants use sunlight, then animals get energy from plants or other animals.'],['Which is a producer in a pond food chain?','algae',['algae','frog','fish','heron'],'Producers are living things like plants or algae that make their own food.']],
            ecosystems:[['Which habitat is very dry and has animals adapted to little water?','desert',['desert','rainforest','pond','ice rink'],'A desert is dry and living things there save or find water carefully.'],['Why do some animals blend into leaves or bark?','to hide from danger or sneak up on food',['to hide from danger or sneak up on food','to become a plant','to change the weather','to make maps'],'Camouflage helps animals survive.'],['What happens when a habitat loses many plants?','some animals may lose food or shelter',['some animals may lose food or shelter','animals get extra houses','the Moon gets closer','rocks start flying'],'Plants often provide food and shelter in ecosystems.']],
            history_compare:[['How was sending a message long ago different from sending one today?','It often took longer.',['It often took longer.','It was always faster.','People could only sing messages.','Messages were made of rain.'],'Older communication often moved more slowly than phones or internet messages.'],['What did many people use before cars were common?','horses or walking',['horses or walking','space ships','tablet computers','electric scooters only'],'People often walked or used animals before cars were common.'],['Why do we compare then and now?','to notice how life changed over time',['to notice how life changed over time','to erase old stories','to make clocks stop','to turn maps into food'],'Comparing past and present helps us understand change.']],
            maps_globes:[['What does a map help us do?','find where places are',['find where places are','cook soup','hear music','grow teeth'],'A map shows where places are.'],['What does a globe show?','Earth as a round model',['Earth as a round model','a flat lunch plate','a weather sound','a tiny car'],'A globe is a round model of Earth.'],['Why do maps use symbols?','to show places and features in a small space',['to show places and features in a small space','to hide every place','to make paper heavier','to erase roads'],'Symbols help maps show information clearly.']],
            inventions:[['Why do people invent tools?','to solve problems or make work easier',['to solve problems or make work easier','to make problems bigger','to stop asking questions','to turn off learning'],'Inventions are created to solve needs or problems.'],['Which invention helps people talk across far distances?','telephone',['telephone','spoon','pillow','paintbrush'],'A telephone helps people communicate far away.'],['What should an inventor do after an idea does not work?','try, test, and improve it',['try, test, and improve it','throw away all ideas','never ask why','stop building forever'],'Inventors learn from tests and improve designs.']],
            data_reason:[['Three kids chose apples and five chose bananas. Which fruit got more votes?','bananas',['bananas','apples','both same','no one voted'],'Five is more than three.'],['If a graph bar is taller, what does that usually mean?','it shows more',['it shows more','it shows less','it is always blue','it means stop'],'Taller bars usually show a greater amount.'],['There are 4 red blocks and 4 blue blocks. What is true?','They are equal.',['They are equal.','Red is more.','Blue is more.','There are no blocks.'],'Four and four are the same amount.']],
            measure_reason:[['Which tool measures how long a pencil is?','ruler',['ruler','cup','clock','thermometer'],'A ruler measures length.'],['Which tool measures temperature?','thermometer',['thermometer','ruler','basket','map key'],'A thermometer measures how hot or cold something is.'],['Why should we line up objects at the same starting point to compare length?','so the comparison is fair',['so the comparison is fair','so they disappear','so they change color','so they become food'],'Same starting points make length comparisons fair.']]
          };
          const bank="function layer2Question(skill,band,r,questionIndex,n){var k=skill.kind,id=skill.skill_id||'',banks="+JSON.stringify(banks)+";var key=banks[k]?k:(banks[id]?id:null);if(!key)return null;var item=pick(r,banks[key]);return choice(item[0],item[1],opts(r,item[1],item[2],n),item[3]||item[0],item[4]||null);}\n";
          const hook="var l2=layer2Question(skill,band,r,questionIndex,n);if(l2)return l2;";
          const needle="function qFor(skill,band,r,questionIndex){var k=skill.kind,d=skill.domain_id,B=BANDS[band]||BANDS[3],n=B.choices;";
          if(!s.includes('function layer2Question(skill,band,r,questionIndex,n){')){
            if(!s.includes(needle)) throw new Error('qFor header not found for layer2 insertion');
            s=s.replace(needle,bank+needle+'\n '+hook);
          }else if(!s.includes(hook)){
            if(!s.includes(needle)) throw new Error('qFor header not found for layer2 hook');
            s=s.replace(needle,needle+'\n '+hook);
          }
          fs.writeFileSync(file,s);
          NODE
      - name: Verify layer two
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('sakhi-activities.js','utf8');
          if(!s.includes('function layer2Question(skill,band,r,questionIndex,n){')) throw new Error('Layer 2 content bank missing');
          if(!s.includes('animal_diets')||!s.includes('solar_system')||!s.includes('data_reason')) throw new Error('Layer 2 priority topics missing');
          NODE
          npm run test:source-architecture
          npm run test:schoolwork
          npm run test:student-experience
          npm run build
          npm run validate:dist
      - name: Commit layer two
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sakhi-activities.js index.html manifest.json sw.js vendor/kokoro-runtime.js
            git commit -m "Layer 2 expand science and world content banks"
            git push origin HEAD:main
          fi
