name: Audit remediation

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/audit-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layer-two:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply layer two content depth expansion
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='sakhi-activities.js';
          let s=fs.readFileSync(file,'utf8');
          const marker="function layer2Question(skill,band,r,questionIndex,n){";
          const bank=`function layer2Question(skill,band,r,questionIndex,n){
 var k=skill.kind,id=skill.skill_id||'',banks={
  astronomy:[
   ['Why do we see the Moon change shape during the month?','We see different lit parts of the Moon.',['We see different lit parts of the Moon.','The Moon becomes a new planet.','Clouds cut the Moon into pieces.','The Sun turns off at night.'],'The Moon does not really change shape. We see different sunlit parts.'],
   ['Which object is a star?','the Sun',['the Sun','the Moon','Earth','a rocket'],'The Sun is a star close enough to warm Earth.'],
   ['Why does daytime happen?','Our side of Earth faces the Sun.',['Our side of Earth faces the Sun.','The Moon pushes light down.','Earth stops moving.','Clouds become bright.'],'Day happens when your side of Earth faces the Sun.'],
   ['What tool helps people look at faraway stars and planets?','a telescope',['a telescope','a spoon','a thermometer','a rain boot'],'A telescope makes faraway space objects easier to see.'],
   ['Which is safest for looking at the Sun?','Do not stare at it directly.',['Do not stare at it directly.','Look with wide open eyes.','Use regular sunglasses only.','Look longer to see better.'],'The Sun is too bright to stare at directly.']
  ],
  space:[
   ['What keeps astronauts breathing inside a spacecraft?','stored air and life-support systems',['stored air and life-support systems','open windows','tree branches','rain clouds'],'Spacecraft carry systems that provide safe air.'],
   ['What is one reason astronauts wear space suits outside a spacecraft?','Space has no air to breathe.',['Space has no air to breathe.','Space suits make rain.','Space is full of grass.','Space suits grow food.'],'A space suit protects the astronaut and provides air.'],
   ['Which is closest to Earth?','the Moon',['the Moon','Jupiter','Saturn','another galaxy'],'The Moon is Earths closest natural neighbor in space.'],
   ['Why do rockets need a lot of force to launch?','They must push away from Earth.',['They must push away from Earth.','They are made of paper.','They are trying to become clouds.','They move only downhill.'],'A rocket needs a strong push to lift off.'],
   ['What should we call Earth in space?','a planet',['a planet','a spoon','a seed','a candle'],'Earth is the planet where we live.']
  ],
  solar_system:[
   ['What do planets in our solar system move around?','the Sun',['the Sun','a tree','the classroom','a mountain'],'Planets travel around the Sun.'],
   ['Which planet do we live on?','Earth',['Earth','Mars','Saturn','Neptune'],'Earth is our home planet.'],
   ['Which planet is known for bright rings?','Saturn',['Saturn','Earth','Mercury','Mars'],'Saturn has large visible rings.'],
   ['Why is Mars often called the red planet?','Its surface has rusty-colored dust.',['Its surface has rusty-colored dust.','It is covered in red paint.','It is made of strawberries.','It glows like a stop sign.'],'Mars looks reddish because of rusty-colored minerals in its dust.'],
   ['Which is bigger: Earth or the Sun?','the Sun',['the Sun','Earth','they are the same size','a school bus'],'The Sun is much bigger than Earth.']
