name: Audit remediation

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/audit-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layer-three:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply layer three visual enrichment and release hygiene
        run: |
          node <<'NODE'
          const fs=require('fs');
          function writeJson(file,obj){fs.writeFileSync(file,JSON.stringify(obj,null,2)+'\n');}
          const version='4.10.0';
          const experienceVersion='4.10.0-layer3-visuals';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version=version;
          writeJson('package.json',pkg);
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          lock.version=version;
          if(lock.packages&&lock.packages[''])lock.packages[''].version=version;
          writeJson('package-lock.json',lock);
          let exp=fs.readFileSync('sakhi-experience.js','utf8');
          exp=exp.replace(/version:'[^']*'/,"version:'"+experienceVersion+"'");
          fs.writeFileSync('sakhi-experience.js',exp);

          let activities=fs.readFileSync('sakhi-activities.js','utf8');
          if(!activities.includes('function layer3Media(')){
            const layer3Media="function layer3Media(skill,item){var key=skill.kind||skill.skill_id||'',map={astronomy:'moon',space:'moon',solar_system:'sun',animal_diets:'cat',food_chain:'tree',ecosystems:'tree',history_compare:'book',maps_globes:'star',inventions:'cup',data_reason:'ribbons',measure_reason:'cup'};var visual=map[key]||map[skill.skill_id];if(!visual)return item[4]||null;var base=item[4]||{};var out={};Object.keys(base).forEach(function(k){out[k]=base[k];});out.visual=visual;return out;}\n";
            if(!activities.includes('function layer2Question(skill,band,r,questionIndex,n){')) throw new Error('layer2Question not found for Layer 3 visual media hook');
            activities=activities.replace('function layer2Question(skill,band,r,questionIndex,n){',layer3Media+'function layer2Question(skill,band,r,questionIndex,n){');
          }
          const oldReturn="var item=pick(r,banks[key]);return choice(item[0],item[1],opts(r,item[1],item[2],n),item[3]||item[0],item[4]||null);";
          const newReturn="var item=pick(r,banks[key]);var media=layer3Media(skill,item);return choice(item[0],item[1],opts(r,item[1],item[2],n),item[3]||item[0],media);";
          if(activities.includes(oldReturn)) activities=activities.replace(oldReturn,newReturn);
          else if(!activities.includes('var media=layer3Media(skill,item);')) throw new Error('Layer 2 return site not found for Layer 3 visual media hook');
          if(!activities.includes('var media=layer3Media(skill,item);')) throw new Error('Layer 3 media hook missing');
          fs.writeFileSync('sakhi-activities.js',activities);
          NODE
          npm run narration:collect
          npm run narration:generate
      - name: Verify full functionality
        run: |
          npm run release
          npm run test:navigation
          npm run test:interaction-regression
          npm run test:touch-interaction
          npm run test:dist-smoke
      - name: Commit layer three
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json sakhi-activities.js sakhi-experience.js assets/audio/narration index.html manifest.json sw.js dist vendor/kokoro-runtime.js
            git commit -m "Layer 3 visual enrichment and narration coverage"
            git push origin HEAD:main
          fi
