   ['Which clue shows an animal may be a carnivore?','sharp teeth for catching prey',['sharp teeth for catching prey','flat leaves on its head','roots in soil','wheels under its feet'],'Carnivores often have body parts that help catch or eat animals.']
  ],
  food_chain:[
   ['In a simple chain grass -> rabbit -> fox, who eats the grass?','rabbit',['rabbit','fox','grass','cloud'],'The rabbit eats the grass.'],
   ['In grass -> rabbit -> fox, what does the fox eat?','rabbit',['rabbit','grass','sunlight','soil'],'The fox gets energy by eating the rabbit.'],
   ['Where does a food chain usually get its first energy?','the Sun',['the Sun','a backpack','a pencil','a shoe'],'Plants use sunlight, then animals get energy from plants or other animals.'],
   ['Which is a producer in a pond food chain?','algae',['algae','frog','fish','heron'],'Producers are living things like plants or algae that make their own food.'],
