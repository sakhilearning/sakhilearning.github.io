   ['What do pond animals need from their habitat?','water, food, and shelter',['water, food, and shelter','only crayons','a rocket engine','a refrigerator'],'A habitat must provide what living things need.'],
   ['Why do some animals blend into leaves or bark?','to hide from danger or sneak up on food',['to hide from danger or sneak up on food','to become a plant','to change the weather','to make maps'],'Camouflage helps animals survive.'],
   ['Which pair belongs together in an ocean ecosystem?','fish and seaweed',['fish and seaweed','camel and cactus snow','lion and traffic light','frog and toaster'],'Fish and seaweed can both be part of an ocean ecosystem.'],
   ['What happens when a habitat loses many plants?','some animals may lose food or shelter',['some animals may lose food or shelter','animals get extra houses','the Moon gets closer','rocks start flying'],'Plants often provide food and shelter in ecosystems.']
  ],
  history_compare:[
   ['How was sending a message long ago different from sending one today?','It often took longer.',['It often took longer.','It was always faster.','People could only sing messages.','Messages were made of rain.'],'Older communication often moved more slowly than phones or internet messages.'],
   ['What did many people use before cars were common?','horses or walking',['horses or walking','space ships','tablet computers','electric scooters only'],'People often walked or used animals before cars were common.'],
   ['Why do we compare then and now?','to notice how life changed over time',['to notice how life changed over time','to erase old stories','to make clocks stop','to turn maps into food'],'Comparing past and present helps us understand change.'],
   ['Which item is more likely from long ago?','a handwritten letter delivered by mail',['a handwritten letter delivered by mail','a video call','a touch-screen tablet','a robot vacuum'],'Handwritten letters were a common way to send messages long ago.'],
   ['What stayed important both long ago and today?','families helping each other',['families helping each other','only riding dinosaurs','never learning new things','sleeping in trees'],'Some needs and values stay important across time.']
  ],
  maps_globes:[
   ['What does a map help us do?','find where places are',['find where places are','cook soup','hear music','grow teeth'],'A map shows where places are.'],
   ['What does a globe show?','Earth as a round model',['Earth as a round model','a flat lunch plate','a weather sound','a tiny car'],'A globe is a round model of Earth.'],
   ['Which map symbol might show water?','blue area',['blue area','a loud bell','a cookie crumb','a shoe lace'],'Maps often show water in blue.'],
   ['If north is at the top of a map, which direction is usually at the bottom?','south',['south','north','inside','yesterday'],'On many maps, south is opposite north.'],
   ['Why do maps use symbols?','to show places and features in a small space',['to show places and features in a small space','to hide every place','to make paper heavier','to erase roads'],'Symbols help maps show information clearly.']
  ],
  inventions:[
   ['Why do people invent tools?','to solve problems or make work easier',['to solve problems or make work easier','to make problems bigger','to stop asking questions','to turn off learning'],'Inventions are created to solve needs or problems.'],
   ['Which invention helps people talk across far distances?','telephone',['telephone','spoon','pillow','paintbrush'],'A telephone helps people communicate far away.'],
   ['Which problem did the wheel help solve?','moving heavy things more easily',['moving heavy things more easily','making rain stop','growing hair faster','reading minds'],'Wheels help objects move with less effort.'],
   ['What should an inventor do after an idea does not work?','try, test, and improve it',['try, test, and improve it','throw away all ideas','never ask why','stop building forever'],'Inventors learn from tests and improve designs.'],
   ['Which is a good question for an inventor?','What problem am I trying to solve?',['What problem am I trying to solve?','How do I avoid testing?','Can I ignore the user?','How do I make it confusing?'],'Good inventions start with understanding the problem.']
  ],
  data_reason:[
   ['Three kids chose apples and five chose bananas. Which fruit got more votes?','bananas',['bananas','apples','both same','no one voted'],'Five is more than three.'],
   ['A chart shows 2 sunny days and 6 rainy days. Which happened more?','rainy days',['rainy days','sunny days','both same','snowy days'],'Six rainy days is more than two sunny days.'],
   ['If a graph bar is taller, what does that usually mean?','it shows more',['it shows more','it shows less','it is always blue','it means stop'],'Taller bars usually show a greater amount.'],
   ['There are 4 red blocks and 4 blue blocks. What is true?','They are equal.',['They are equal.','Red is more.','Blue is more.','There are no blocks.'],'Four and four are the same amount.'],
   ['Which question can data answer?','Which snack did our class choose most?',['Which snack did our class choose most?','What does the Moon taste like?','Can pencils dream?','Why is purple sleepy?'],'Data can answer counting and comparison questions.']
  ],
  measure_reason:[
   ['Which tool measures how long a pencil is?','ruler',['ruler','cup','clock','thermometer'],'A ruler measures length.'],
   ['Which is heavier: a full backpack or one sheet of paper?','full backpack',['full backpack','one sheet of paper','they are always the same','a shadow'],'A full backpack usually weighs more than paper.'],
   ['Which tool measures temperature?','thermometer',['thermometer','ruler','basket','map key'],'A thermometer measures how hot or cold something is.'],
   ['If one tower has 8 blocks and another has 5, which is taller if blocks match?','the 8-block tower',['the 8-block tower','the 5-block tower','both same','the paper tower'],'Eight same-size blocks make a taller tower than five.'],
   ['Why should we line up objects at the same starting point to compare length?','so the comparison is fair',['so the comparison is fair','so they disappear','so they change color','so they become food'],'Same starting points make length comparisons fair.']
  ],
  plant:[
   ['What do roots do for a plant?','take in water and hold the plant',['take in water and hold the plant','make animal sounds','shine like a lamp','fly to the Moon'],'Roots help plants get water and stay anchored.'],
   ['What does a seed need to start growing?','water, warmth, and time',['water, warmth, and time','a television','a pencil case','a loud horn'],'Seeds need the right conditions to sprout.'],
   ['Which part of a plant often makes seeds?','flower',['flower','rock','shoe','cloud'],'Many flowers help make seeds.'],
   ['Why do leaves help a plant?','They help make food using sunlight.',['They help make food using sunlight.','They work like wheels.','They turn into fish.','They make thunder.'],'Leaves help plants use sunlight to make food.'],
   ['What should you observe to see plant growth?','height, leaves, and changes over days',['height, leaves, and changes over days','only the pot color','only the room noise','only your shoes'],'Plant growth can be observed over time.']
  ],
  weather:[
   ['Which clothing fits a rainy day best?','raincoat',['raincoat','swimsuit only','snow skis','party crown'],'Raincoats help keep us dry in rain.'],
   ['What does wind move?','air',['air','the Sun','the Moon','mountains every day'],'Wind is moving air.'],
   ['Which tool can show how hot or cold the air is?','thermometer',['thermometer','map key','paintbrush','fork'],'A thermometer measures temperature.'],
   ['Dark clouds and thunder can be a clue for what weather?','storm',['storm','very dry desert only','perfectly still air','no weather'],'Dark clouds and thunder can signal a storm.'],
   ['Why do we check weather before going outside?','to choose safe clothes and plans',['to choose safe clothes and plans','to make the Sun rise','to stop clocks','to count pencils'],'Weather helps us plan what to wear and do.']
  ]
 };
 var key=banks[k]?k:(banks[id]?id:null);if(!key)return null;
 var item=pick(r,banks[key]);
 return choice(item[0],item[1],opts(r,item[1],item[2],n),item[3]||item[0],item[4]||null);
}
`;
          if(!s.includes(marker)){
            const needle="function qFor(skill,band,r,questionIndex){var k=skill.kind,d=skill.domain_id,B=BANDS[band]||BANDS[3],n=B.choices;";
            if(!s.includes(needle)) throw new Error('qFor header not found for layer2 insertion');
            s=s.replace(needle,bank+needle+"\n var l2=layer2Question(skill,band,r,questionIndex,n);if(l2)return l2;");
          }else if(!s.includes('var l2=layer2Question(skill,band,r,questionIndex,n);if(l2)return l2;')){
            const needle="function qFor(skill,band,r,questionIndex){var k=skill.kind,d=skill.domain_id,B=BANDS[band]||BANDS[3],n=B.choices;";
            if(!s.includes(needle)) throw new Error('qFor header not found for existing layer2 hook');
            s=s.replace(needle,needle+"\n var l2=layer2Question(skill,band,r,questionIndex,n);if(l2)return l2;");
          }
          fs.writeFileSync(file,s);
          NODE
      - name: Verify layer two
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('sakhi-activities.js','utf8');
          if(!s.includes('function layer2Question(skill,band,r,questionIndex,n){')) throw new Error('Layer 2 content bank missing');
          if(!s.includes('animal_diets')||!s.includes('solar_system')||!s.includes('data_reason')) throw new Error('Layer 2 priority topics missing');
          NODE
          npm run test:source-architecture
          npm run test:schoolwork
          npm run test:student-experience
          npm run build
          npm run validate:dist
      - name: Commit layer two
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sakhi-activities.js index.html manifest.json sw.js vendor/kokoro-runtime.js
            git commit -m "Layer 2 expand science and world content banks"
            git push origin HEAD:main
          fi
