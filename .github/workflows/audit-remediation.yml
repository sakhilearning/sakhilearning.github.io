name: Audit remediation

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/audit-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  layer-two:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply layer two content depth expansion
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='sakhi-activities.js';
          let s=fs.readFileSync(file,'utf8');
          function q(p,a,w,e){return[p,a,w,e||p];}
          const banks={
            astronomy:[
              q('What is the Sun?','a star',['a moon','a planet','a cloud'],'The Sun is a star close to Earth.'),
              q('Why does the Moon look bright at night?','It reflects sunlight.',['It makes its own light.','It is a flashlight.','It is on fire.'],'The Moon reflects light from the Sun.'),
              q('Why do we see different Moon shapes?','We see different lit parts.',['The Moon breaks apart.','Clouds cut it.','It changes into a star.'],'The Moon stays round, but we see different sunlit parts.'),
              q('What tool helps us look at faraway stars?','telescope',['thermometer','ruler','bucket'],'A telescope makes faraway space objects easier to see.'),
              q('What should you do around the bright Sun?','Do not stare directly at it.',['Stare longer.','Use only regular sunglasses.','Look through a toy tube.'],'The Sun is too bright to look at directly.'),
              q('What is a constellation?','a pattern of stars',['a kind of rain','a baby planet','a rocket snack'],'People imagine patterns by connecting stars in the sky.'),
              q('Why do stars look tiny from Earth?','They are very far away.',['They are all tiny dots.','They are inside clouds.','They shrink at night.'],'Many stars are huge, but they are very far away.'),
              q('What is Earth?','a planet',['a star','a comet','a telescope'],'Earth is the planet where we live.'),
              q('What happens when our side of Earth faces the Sun?','daytime',['midnight','winter only','a full Moon'],'Day happens when your side of Earth faces the Sun.'),
              q('Which object travels around Earth?','the Moon',['the Sun','Mars','Saturn'],'The Moon orbits Earth.')
            ],
            space:[
              q('Why do astronauts need air systems in spacecraft?','Space has no air to breathe.',['Space has too much grass.','Space has rain clouds.','Space has open windows.'],'Spacecraft carry systems that provide safe air.'),
              q('Why wear a space suit outside a spacecraft?','It protects and gives air.',['It makes thunder.','It grows plants.','It turns into a map.'],'A space suit protects the astronaut and provides air.'),
              q('Which is closest to Earth?','the Moon',['Jupiter','Saturn','another galaxy'],'The Moon is Earths closest natural neighbor.'),
              q('Why does a rocket need a strong push?','to lift away from Earth',['to become paper','to fall asleep','to make clouds'],'A rocket needs force to launch upward.'),
              q('What is orbiting?','moving around another object',['standing still forever','turning into water','drawing with crayons'],'Objects in space can travel around other objects.'),
              q('Why can astronauts float inside spacecraft?','there is very little gravity feeling',['they are balloons','they have wings','the floor is sticky'],'Astronauts can feel weightless in orbit.'),
              q('What is a spacecraft built to do?','travel or work in space',['cook soup','cut hair','grow shoes'],'Spacecraft help people or tools work in space.'),
              q('What is a satellite?','an object that moves around a planet',['a kind of sandwich','a desert animal','a raincoat'],'Satellites orbit planets or moons.'),
              q('What do astronauts train to do?','work safely in space',['sleep through every task','ignore tools','breathe underwater only'],'Astronauts practice skills before missions.'),
              q('Why do we use robots in space?','to explore places safely',['to make candy','to hide maps','to stop learning'],'Robots can explore places people cannot easily go.')
            ],
            solar_system:[
              q('What do planets in our solar system move around?','the Sun',['a tree','the classroom','a mountain'],'Planets travel around the Sun.'),
              q('Which planet do we live on?','Earth',['Mars','Saturn','Neptune'],'Earth is our home planet.'),
              q('Which planet is known for bright rings?','Saturn',['Earth','Mercury','Mars'],'Saturn has large visible rings.'),
              q('Why is Mars called the red planet?','rusty-colored dust',['red paint','strawberries','stop signs'],'Mars looks reddish because of minerals in its dust.'),
              q('Which is bigger: Earth or the Sun?','the Sun',['Earth','same size','a school bus'],'The Sun is much bigger than Earth.'),
              q('Which planet is closest to the Sun?','Mercury',['Neptune','Saturn','Earth'],'Mercury is closest to the Sun.'),
              q('Which planet is famous for being very large?','Jupiter',['Mercury','the Moon','Pluto'],'Jupiter is the largest planet in our solar system.'),
              q('What is the solar system?','the Sun and objects around it',['one classroom','only Earth','a rainstorm'],'The solar system includes the Sun, planets, moons, and more.'),
              q('What do we call a natural object that orbits a planet?','moon',['map','seed','shoe'],'Moons travel around planets.'),
              q('Which planet is very far from the Sun and cold?','Neptune',['Mercury','Venus','Earth'],'Neptune is far from the Sun and very cold.')
            ],
            animal_diets:[
              q('A cow mostly eats grass. What kind of eater is it?','herbivore',['carnivore','omnivore','meteorologist'],'Herbivores eat plants.'),
              q('A lion hunts and eats other animals. What kind of eater is it?','carnivore',['herbivore','map maker','gardener'],'Carnivores eat animals.'),
              q('A bear can eat berries and fish. What kind of eater is it?','omnivore',['herbivore only','carnivore only','astronaut'],'Omnivores eat both plants and animals.'),
              q('Which food best fits a rabbit?','leafy plants',['metal nails','glass marbles','plastic blocks'],'Rabbits are plant eaters.'),
              q('Which clue may show a carnivore?','sharp teeth for catching prey',['roots in soil','flat leaves','wheels'],'Carnivores often have body parts for catching or eating animals.'),
              q('A deer eats leaves and grass. What is it?','herbivore',['carnivore','robot','fish only'],'Deer eat plants.'),
              q('A chicken eats seeds and bugs. What is it?','omnivore',['plant only eater','rock eater','cloud eater'],'Some animals eat both plant and animal foods.'),
              q('Which animal is most likely a carnivore?','hawk',['cow','rabbit','horse'],'Hawks eat other animals.'),
              q('Why do animals need food?','for energy to live and grow',['to become clouds','to make maps','to stop moving forever'],'Food gives animals energy.'),
              q('Which animal diet word means plant eater?','herbivore',['carnivore','omnivore','inventor'],'Herbivore means plant eater.')
            ],
            food_chain:[
              q('In grass -> rabbit -> fox, who eats the grass?','rabbit',['fox','grass','cloud'],'The rabbit eats the grass.'),
              q('Where does a food chain usually get first energy?','the Sun',['a backpack','a pencil','a shoe'],'Plants use sunlight, then animals get energy from plants or animals.'),
              q('Which is a producer in a pond food chain?','algae',['frog','fish','heron'],'Producers make their own food.'),
              q('In leaf -> caterpillar -> bird, what eats the caterpillar?','bird',['leaf','rain','rock'],'The bird eats the caterpillar.'),
              q('What is prey?','an animal that is hunted or eaten',['a map symbol','a type of cloud','a baby plant'],'Prey is eaten by a predator.'),
              q('What is a predator?','an animal that hunts other animals',['a plant root','a weather tool','a map line'],'Predators hunt prey.'),
              q('What might happen if many rabbits disappear?','foxes may have less food',['grass turns to rocks','the Sun stops','fish grow wings'],'If prey decreases, predators may have less food.'),
              q('Which chain is in a garden?','lettuce -> snail -> bird',['pencil -> shoe -> moon','rock -> lamp -> rain','chair -> cloud -> fox'],'A garden chain can include plants and animals.'),
              q('What does an arrow in a food chain often show?','energy moving to the eater',['north on a map','where to sit','a sound pattern'],'Arrows show energy moving through the chain.'),
              q('Which living thing can make its own food using sunlight?','plant',['fox','rabbit','owl'],'Plants are producers.')
            ],
            ecosystems:[
              q('Which habitat is very dry?','desert',['rainforest','pond','ice rink'],'Deserts are dry habitats.'),
              q('Why do animals blend into leaves or bark?','to hide or hunt',['to become plants','to change weather','to make maps'],'Camouflage helps animals survive.'),
              q('What happens if a habitat loses many plants?','animals may lose food or shelter',['animals get extra houses','the Moon gets closer','rocks fly'],'Plants often provide food and shelter.'),
              q('What do pond animals need?','water, food, and shelter',['only crayons','a rocket','a refrigerator'],'Habitats provide needs for living things.'),
              q('Which belongs in an ocean ecosystem?','fish and seaweed',['camel and cactus snow','lion and traffic light','frog and toaster'],'Fish and seaweed can live in ocean ecosystems.'),
              q('What is a habitat?','a place where a living thing lives',['a kind of number','a loud sound','a pretend planet'],'Habitats are homes for living things.'),
              q('Which habitat has many trees and shade?','forest',['desert only','parking lot only','outer space'],'Forests have many trees.'),
              q('Why do bees visit flowers?','to get nectar and move pollen',['to read books','to make snow','to build roads'],'Bees and flowers can help each other.'),
              q('Which change can hurt an ecosystem?','polluting water',['cleaning a trail','planting trees','saving water'],'Pollution can harm living things.'),
              q('What is one sign of a healthy habitat?','living things have food and shelter',['all plants are gone','water is dirty','animals cannot find homes'],'Healthy habitats meet living things needs.')
            ],
            history_compare:[
              q('How was sending a message long ago often different?','It often took longer.',['It was always faster.','People only sang messages.','Messages were rain.'],'Older communication often moved more slowly.'),
              q('What did many people use before cars were common?','horses or walking',['space ships','tablets','electric scooters only'],'People often walked or used animals.'),
              q('Why compare then and now?','to notice how life changed',['to erase stories','to stop clocks','to turn maps into food'],'Comparing past and present helps us understand change.'),
              q('Which is more likely from long ago?','handwritten letter',['video call','touch-screen tablet','robot vacuum'],'Letters were common before instant digital messages.'),
              q('What stayed important long ago and today?','families helping each other',['riding dinosaurs','never learning','sleeping in trees'],'Some values stay important over time.'),
              q('How did people often get news long ago?','newspapers or word of mouth',['smart watches only','video games only','moon messages'],'News often traveled by print or people talking.'),
              q('Which chore changed with machines?','washing clothes',['watching stars','telling stories','having family meals'],'Machines changed how many chores are done.'),
              q('What did children long ago still do?','play games',['drive every car','use every tablet','fly rockets daily'],'Children have played games across time.'),
              q('Why do old photos help us learn?','They show clues about the past.',['They predict tomorrow exactly.','They erase memories.','They make maps talk.'],'Photos can show clothing, tools, and places from the past.'),
              q('Which transport is newer?','airplane travel',['walking','horse cart','canoe'],'Airplanes are newer than many older ways to travel.')
            ],
            maps_globes:[
              q('What does a map help us do?','find where places are',['cook soup','hear music','grow teeth'],'Maps show where places are.'),
              q('What does a globe show?','Earth as a round model',['flat lunch plate','weather sound','tiny car'],'A globe is a round model of Earth.'),
              q('Why do maps use symbols?','to show features in small space',['to hide every place','to make paper heavy','to erase roads'],'Symbols help maps show information clearly.'),
              q('Which color often shows water on a map?','blue',['orange stripes','black dots only','pink arrows'],'Water is often shown in blue.'),
              q('If north is at the top, what is at the bottom?','south',['north','inside','yesterday'],'South is opposite north.'),
              q('What is a map key?','a guide that explains symbols',['a door key','a music note','a snack label'],'A map key tells what symbols mean.'),
              q('What does a compass rose show?','directions',['temperature','animal diets','story endings'],'A compass rose shows north, south, east, and west.'),
              q('Which map would help find a classroom?','school map',['space telescope','recipe card','weather thermometer'],'A school map can show rooms and paths.'),
              q('What does zooming in on a map show?','more detail',['less detail always','only oceans','yesterday'],'Zooming in shows a smaller area with more detail.'),
              q('What is a landmark?','a place people use to find location',['a kind of soup','a silent sound','a Moon shape'],'Landmarks help people describe where things are.')
            ],
            inventions:[
              q('Why do people invent tools?','to solve problems',['to make problems bigger','to stop asking questions','to turn off learning'],'Inventions solve needs or problems.'),
              q('Which invention helps people talk far away?','telephone',['spoon','pillow','paintbrush'],'A telephone helps people communicate.'),
              q('What should an inventor do after an idea fails?','test and improve it',['throw away every idea','never ask why','stop building forever'],'Inventors learn from tests.'),
              q('Which problem did the wheel help solve?','moving heavy things easier',['making rain stop','growing hair','reading minds'],'Wheels help objects move.'),
              q('What is a good inventor question?','What problem am I solving?',['How do I avoid testing?','Can I ignore users?','How do I confuse people?'],'Good inventions start with a problem.'),
              q('Which invention helps us see in the dark?','light bulb',['blanket','spoon','kite'],'Light bulbs provide light.'),
              q('Why are refrigerators useful?','They help keep food cold.',['They make pencils fly.','They wash cars.','They grow clouds.'],'Refrigerators slow food spoilage by keeping it cold.'),
              q('What does testing an invention show?','what works and what needs fixing',['that no changes are allowed','that questions are bad','that ideas vanish'],'Testing helps improve designs.'),
              q('Which invention helps people travel faster than walking?','bicycle',['pillow','cup','paintbrush'],'Bicycles help people move faster.'),
              q('Why share an invention idea with others?','to get feedback',['to hide every problem','to stop improving','to erase the plan'],'Feedback helps improve ideas.')
            ],
            data_reason:[
              q('Three kids chose apples and five chose bananas. Which got more votes?','bananas',['apples','both same','no one voted'],'Five is more than three.'),
              q('If a graph bar is taller, what does it usually mean?','it shows more',['it shows less','it is always blue','it means stop'],'Taller bars usually show more.'),
              q('There are 4 red blocks and 4 blue blocks. What is true?','They are equal.',['Red is more.','Blue is more.','There are no blocks.'],'Four and four are equal.'),
              q('A chart shows 2 sunny days and 6 rainy days. Which happened more?','rainy days',['sunny days','snowy days','both same'],'Six is more than two.'),
              q('Which question can data answer?','Which snack got most votes?',['Can pencils dream?','What does the Moon taste like?','Why is purple sleepy?'],'Data can answer counting and comparison questions.'),
              q('If 7 kids like soccer and 3 like tag, which group is larger?','soccer',['tag','both same','no group'],'Seven is greater than three.'),
              q('What should we do before making a graph?','collect and count data',['close our eyes','erase all numbers','hide the question'],'Graphs start with data.'),
              q('If two bars are the same height, what does that mean?','same amount',['one is always bigger','no one counted','the graph broke'],'Equal bar height means equal amounts.'),
              q('Which tool helps show votes clearly?','picture graph',['rain boot','story pillow','glue cap'],'Graphs organize data so we can compare.'),
              q('Why label a graph?','so people know what it shows',['to make it secret','to erase numbers','to change votes'],'Labels explain the data.')
            ],
            measure_reason:[
              q('Which tool measures how long a pencil is?','ruler',['cup','clock','thermometer'],'A ruler measures length.'),
              q('Which tool measures temperature?','thermometer',['ruler','basket','map key'],'A thermometer measures hot and cold.'),
              q('Why line up objects at the same start point to compare length?','so comparison is fair',['so they disappear','so they change color','so they become food'],'Same starting points make length comparisons fair.'),
              q('Which is usually heavier: backpack or paper?','backpack',['paper','shadow','feather drawing'],'A full backpack usually weighs more.'),
              q('What measures how much a cup can hold?','capacity',['length','color','sound'],'Capacity tells how much something can hold.'),
              q('Which unit could measure classroom length?','steps',['spoons','raindrops','songs'],'Steps can be a nonstandard length unit.'),
              q('If one tower has 8 equal blocks and one has 5, which is taller?','8-block tower',['5-block tower','same always','paper tower'],'Eight equal blocks make a taller tower than five.'),
              q('Which tool measures time?','clock',['ruler','cup','scale'],'Clocks measure time.'),
              q('Why use the same unit when measuring two things?','to compare fairly',['to make one vanish','to make numbers sleepy','to avoid counting'],'Same units make comparisons fair.'),
              q('Which container likely holds more: bucket or spoon?','bucket',['spoon','both always same','pencil'],'A bucket usually has more capacity than a spoon.')
            ]
          };
          const bank="function layer2Question(skill,band,r,questionIndex,n){var k=skill.kind,id=skill.skill_id||'',banks="+JSON.stringify(banks)+";var key=banks[k]?k:(banks[id]?id:null);if(!key)return null;var item=pick(r,banks[key]);return choice(item[0],item[1],opts(r,item[1],item[2],n),item[3]||item[0],item[4]||null);}\n";
          const hook="var l2=layer2Question(skill,band,r,questionIndex,n);if(l2)return l2;";
          const needle="function qFor(skill,band,r,questionIndex){var k=skill.kind,d=skill.domain_id,B=BANDS[band]||BANDS[3],n=B.choices;";
          if(!s.includes('function layer2Question(skill,band,r,questionIndex,n){')){
            if(!s.includes(needle)) throw new Error('qFor header not found for layer2 insertion');
            s=s.replace(needle,bank+needle+'\n '+hook);
          }else if(!s.includes(hook)){
            if(!s.includes(needle)) throw new Error('qFor header not found for layer2 hook');
            s=s.replace(needle,needle+'\n '+hook);
          }
          fs.writeFileSync(file,s);
          NODE
      - name: Verify layer two
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('sakhi-activities.js','utf8');
          if(!s.includes('function layer2Question(skill,band,r,questionIndex,n){')) throw new Error('Layer 2 content bank missing');
          if(!s.includes('animal_diets')||!s.includes('solar_system')||!s.includes('data_reason')) throw new Error('Layer 2 priority topics missing');
          NODE
          npm run test:source-architecture
          npm run test:schoolwork
          npm run test:student-experience
          npm run build
          npm run validate:dist
      - name: Commit layer two
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sakhi-activities.js index.html manifest.json sw.js vendor/kokoro-runtime.js
            git commit -m "Layer 2 expand science and world content banks"
            git push origin HEAD:main
          fi
