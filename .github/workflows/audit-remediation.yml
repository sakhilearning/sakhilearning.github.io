name: Audit remediation

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/audit-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  narration-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply narration and update signal fix
        run: |
          node <<'NODE'
          const fs=require('fs');
          function writeJson(file,obj){fs.writeFileSync(file,JSON.stringify(obj,null,2)+'\n');}
          const version='4.9.1';
          const experienceVersion='4.9.1-layer2-a8dd204';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version=version;
          writeJson('package.json',pkg);
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          lock.version=version;
          if(lock.packages&&lock.packages[''])lock.packages[''].version=version;
          writeJson('package-lock.json',lock);
          let exp=fs.readFileSync('sakhi-experience.js','utf8');
          exp=exp.replace(/version:'[^']*'/,"version:'"+experienceVersion+"'");
          fs.writeFileSync('sakhi-experience.js',exp);
          NODE
          npm run narration:collect
      - name: Verify full release
        run: npm run release
      - name: Commit narration coverage and app update signal
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json sakhi-experience.js assets/audio/narration/texts-v5.json index.html manifest.json sw.js dist vendor/kokoro-runtime.js
            git commit -m "Regenerate narration coverage and bump app update signal"
            git push origin HEAD:main
          fi
