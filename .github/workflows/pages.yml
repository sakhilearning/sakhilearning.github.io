name: Deploy Sakhi Magic Learning

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sakhi
        uses: actions/checkout@v4

      - name: Stamp PWA build metadata
        shell: bash
        run: |
          BUILD_STAMP=$(date -u +"%Y.%m.%d.%H%M")
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          BUILD_ID="${BUILD_STAMP}-${SHORT_SHA}"
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > build-info.js <<EOF
          window.SAKHI_BUILD_ID = "${BUILD_ID}";
          window.SAKHI_BUILD_INFO = Object.freeze({
            build: "${BUILD_ID}",
            commit: "${GITHUB_SHA}",
            built_at: "${BUILT_AT}"
          });
          EOF
          cat > version.json <<EOF
          {"build":"${BUILD_ID}","commit":"${GITHUB_SHA}","built_at":"${BUILT_AT}"}
          EOF
          python3 - <<'PY'
          import os
          from pathlib import Path
          sw = Path('sw.js')
          text = sw.read_text()
          text = text.replace('__SAKHI_BUILD_ID__', os.environ.get('BUILD_ID', 'unknown-build'))
          sw.write_text(text)
          PY
        env:
          BUILD_ID: ${{ github.run_id }}-${{ github.sha }}

      - name: Validate application architecture
        run: |
          node --check app.js
          node --check core-learning-services.js
          node --check settings-service.js
          node --check adventure-service.js
          node --check settings-ui.js
          node --check pwa-update.js
          node --check activity-contract.js
          node --check reward-service.js
          node --check scheduler.js
          node --check interaction-engine.js
          node --check challenge-bank.js
          node --check foundation-verification-bank.js
          node --check adaptive-acceleration-service.js
          node --check ui-hooks.js
          node --check progress-service.js
          node --check parent-auth-service.js
          node --check asset-service.js
          node --check curriculum.js
          node --check persistence.js
          node --check adaptive-engine.js
          node --check backend-bridge.js
          node --check kid-upgrade.js
          node --check visuals.js
          node --check speech-service.js
          node --check sakhi-shell.js
          node scripts/validate-activities.cjs
          node scripts/validate-audio-architecture.cjs
          node scripts/validate-child-experience.cjs
          node scripts/validate-architecture.cjs
          node scripts/validate-runtime-stability.cjs
          node scripts/validate-adaptive-acceleration.cjs
          node scripts/validate-settings-controls.cjs
          node scripts/validate-pwa-update.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Sakhi site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
