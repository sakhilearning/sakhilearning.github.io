name: Deploy Sakhi Magic Learning

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sakhi destination
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout current Sakhi source
        uses: actions/checkout@v4
        with:
          repository: vgovindam/rainbow-unicorn-phonics
          ref: main
          path: source

      - name: Sync app into Sakhi repository
        shell: bash
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            source/ target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync Sakhi application source"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Sakhi site
        uses: actions/upload-pages-artifact@v3
        with:
          path: target

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
