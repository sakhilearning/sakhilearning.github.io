name: Deploy Sakhi
on:
  push:
    branches: [ main, upgrade/sakhi-v3 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sakhi-ci-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lock for patched dependency override
        if: github.event_name == 'pull_request'
        run: npm install --package-lock-only --ignore-scripts
      - name: Capture refreshed lock
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sakhi-4.9-lockfile
          path: package-lock.json
      - run: npm ci
      - run: npm run release
      - name: Persist generated Kokoro runtime
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- index.html manifest.json sw.js vendor/kokoro-runtime.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html manifest.json sw.js vendor/kokoro-runtime.js
            git commit -m "Persist Sakhi deployment build [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
