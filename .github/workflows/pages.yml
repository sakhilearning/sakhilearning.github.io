name: Deploy Sakhi Magic Learning

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sakhi
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check scheduler.js
          node --check interaction-engine.js
          node --check curriculum.js
          node --check persistence.js
          node --check adaptive-engine.js
          node --check backend-bridge.js
          node --check kid-upgrade.js
          node --check visuals.js
          node --check speech-service.js
          node --check sakhi-shell.js
          node scripts/validate-activities.cjs
          node scripts/validate-audio-architecture.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Sakhi site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
