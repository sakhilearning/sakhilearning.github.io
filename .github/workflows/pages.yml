name: Deploy Sakhi V3.4.0
on:
  push:
    branches: [ main, upgrade/sakhi-v3 ]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Persist generated Kokoro runtime
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- index.html manifest.json sw.js vendor/kokoro-runtime.js dist; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html manifest.json sw.js vendor/kokoro-runtime.js dist
            git commit -m "Persist Sakhi 3.4.0 deployment build [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
